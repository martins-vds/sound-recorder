<!doctype html>
<!-- THROWAWAY: Three meeting-recorder layouts on one browser route, switchable via ?variant=A|B|C.
     Question: which hierarchy best supports meeting capture and transcript review?
     No WPF changes, real audio, network model downloads, or persistent application state. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Recorder / UX prototype</title>
<link rel="icon" href="data:,">
<style>
  :root{font-family:"Segoe UI",Arial,sans-serif;color:#182d31;background:#edf2f1;font-size:14px;--accent:#17604f;--muted:#53686c;--line:#ccd8d5;--soft:#e8f1ed;--red:#ad263a}
  *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}
  button{cursor:pointer;min-height:36px;padding:8px 13px;border:1px solid var(--line);border-radius:6px;background:white;color:inherit;font-weight:600}
  button:hover{background:var(--soft);border-color:var(--accent)}button:disabled{cursor:not-allowed;opacity:.5}button.primary{background:var(--accent);border-color:var(--accent);color:white}
  button.primary:hover{background:#104737}button.stop{background:var(--red);border-color:var(--red);color:white}button.quiet{border-color:transparent;background:transparent}
  :focus-visible{outline:3px solid #27816e;outline-offset:3px}::selection{background:#b6ddce;color:#102b24}
  input,select{width:100%;min-height:38px;border:1px solid #aebeb9;border-radius:5px;background:white;padding:8px 10px;caret-color:var(--accent)}
  input::placeholder{color:#5c6e70}input[type=checkbox]{width:18px;min-height:18px;accent-color:var(--accent);flex:none;margin:3px 0}
  h1,h2,h3,p{margin:0}h1{font-size:28px;line-height:1.2;letter-spacing:-.025em}h2{font-size:19px;line-height:1.35}h3{font-size:14px}
  p{line-height:1.55}small,.muted{color:var(--muted);line-height:1.5}.muted{font-size:13px}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:16px}.gap8{gap:8px}.grow{flex:1;min-width:0}
  .demo-banner{padding:8px 24px;background:#dfeae5;color:#304c43;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .demo-banner select{width:auto;min-height:28px;padding:3px 24px 3px 6px;font-size:12px}.demo-banner label{margin:0}
  .app{max-width:1440px;margin:auto;min-height:calc(100vh - 46px);padding-bottom:110px}.topbar{height:68px;padding:0 28px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:24px}
  .brand{font-size:17px;font-weight:650;display:flex;gap:10px;align-items:center;white-space:nowrap}.brand svg{color:var(--accent)}svg{flex:none}
  .tabs{display:flex;gap:6px}.tabs button[aria-current=page]{background:var(--soft);color:var(--accent)}
  .badge{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:4px;white-space:nowrap;background:#f5f8f6}.badge.ready{background:#e3f2e9;color:#265844;border-color:#bad6c6}
  .badge.pending{background:#fff1d5;color:#75450b;border-color:#e2ccaa}.concept{font-size:11px;color:#614816;background:#f7ead0;padding:3px 6px;border-radius:3px;font-weight:600}
  .page{padding:30px 32px}.intro{margin-bottom:24px}.intro p{margin-top:7px}.section{margin-top:28px}.section-title{margin-bottom:14px}
  .capture-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr);gap:32px}
  .capture-main{background:white;border:1px solid var(--line);border-radius:10px;padding:28px}.capture-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .capture-face{text-align:center;padding:26px 0 24px}.clock{font-size:58px;line-height:1.3;font-variant-numeric:tabular-nums;letter-spacing:-.025em;font-weight:350}
  .status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}.dot{width:8px;height:8px;background:#638079;border-radius:50%}.Recording .dot{background:var(--red)}.Paused .dot{background:#9d6d17}
  .levels{height:50px;display:flex;gap:3px;align-items:center;justify-content:center;margin:16px 0 8px}.levels i{width:4px;height:var(--bar);background:#8aa99c;border-radius:2px}
  .Recording .levels i{background:var(--accent)}.actions{justify-content:center;margin-top:22px}.actions button{min-height:44px;padding:10px 22px}
  .setup{display:grid;gap:18px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.source-buttons{display:flex;gap:6px}.source-buttons button{flex:1;font-size:12px;padding:10px 5px}
  .source-buttons [aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
  details{border-top:1px solid var(--line);padding-top:14px}summary{font-weight:600;cursor:pointer;line-height:1.4;padding:4px 0}details .inside{margin-top:15px;display:grid;gap:14px}
  .permission{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;margin:0;line-height:1.5}.permission span{max-width:70ch}
  .warning{background:#fff0dc;color:#6c4011;padding:12px 14px;border-radius:5px;font-size:12px;line-height:1.55}.rule{height:1px;background:var(--line);margin:20px 0}
  .meeting-list{display:grid;gap:0}.meeting{width:100%;display:flex;align-items:center;text-align:left;gap:14px;border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 4px;font-weight:400}
  .meeting .name{font-weight:600;display:block;margin-bottom:3px}.meeting .meta{font-size:12px;color:var(--muted)}.meeting.selected{background:var(--soft)}
  .meeting svg{color:#456e60}.empty{padding:28px 10px;text-align:center;color:var(--muted);line-height:1.6}
  .review{background:#fff;padding:28px;border:1px solid var(--line);border-radius:8px}.review-heading{margin-bottom:20px}.review-heading h2{font-size:24px;margin-top:12px}.transcript{max-width:70ch;display:grid;gap:22px;margin-top:24px}
  .segment{display:grid;grid-template-columns:55px 1fr;gap:14px}.timestamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.9}.segment p{font-size:15px;line-height:1.75}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.jobs{margin-top:18px;display:grid;gap:10px}.job{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .library-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:28px}.library-layout input{margin-bottom:14px}
  .workspace{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:500px;background:#fff;border-bottom:1px solid var(--line)}
  .library-rail{background:#e3ece8;padding:24px 18px;border-right:1px solid var(--line)}.library-rail h2{margin-bottom:14px}.library-rail input{margin-bottom:14px}.library-rail .meeting{padding:15px 8px;align-items:flex-start}.library-rail .meeting .badge{display:none}
  .reading-pane{padding:30px 38px;min-width:0}.reading-pane .review{padding:0;border:0;border-radius:0}.reading-pane .transcript{max-width:65ch}
  .record-dock{background:#fff;padding:18px 28px;border-bottom:1px solid var(--line)}.record-dock .clock{font-size:26px;min-width:140px}.record-dock .actions{margin:0;justify-content:flex-end}.record-dock .actions button{min-height:38px;padding:8px 16px}
  .record-dock .setup{margin-top:20px;grid-template-columns:1fr 1fr;column-gap:30px}.record-dock .permission-block{grid-column:1/-1}.record-dock .setup details{grid-column:1/-1}
  .guided-shell{display:grid;grid-template-columns:190px minmax(0,1fr) 250px;gap:28px;padding:32px}.steps{display:grid;gap:6px;align-content:start;margin-top:15px}
  .step{display:flex;gap:12px;align-items:center;padding:13px 8px;background:transparent;border-color:transparent;text-align:left}.step b{width:28px;height:28px;border:1px solid #98aaa3;border-radius:50%;display:grid;place-items:center;font-size:12px}
  .step[aria-current=step]{background:#dbe9e2;color:#164f40}.step[aria-current=step] b{background:var(--accent);color:white;border-color:var(--accent)}.step.done b{background:#dbe9e2}
  .guided-main{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px}.guided-main h1{margin-bottom:9px}.guided-main .setup{margin-top:24px}.guided-main .actions{justify-content:flex-end}
  .guided-aside h2{margin-bottom:14px}.guided-aside .meeting{align-items:flex-start}.guided-aside .meeting .badge{display:none}
  .step-controls{display:flex;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.state-details{max-width:1376px;margin:16px 32px 0;font-size:12px}
  .state-details pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#e2eae6;line-height:1.5;max-height:240px;overflow:auto}
  .switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#173d34;color:#fff;border:1px solid #42645a;border-radius:10px;padding:8px 10px;box-shadow:0 8px 26px rgba(0,0,0,.15);z-index:5}
  .switcher button{background:transparent;border-color:#698b7f;color:white;display:grid;place-items:center;padding:8px}.switcher button:hover{background:#2b5548}.switcher .label{min-width:180px;text-align:center;font-size:13px}.switcher small{display:block;font-size:11px;color:#c5d9d0;margin-top:3px}
  .toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #98b4a5;box-shadow:0 6px 24px rgba(0,0,0,.12);border-radius:7px;padding:13px 18px;z-index:6;max-width:min(560px,90vw);font-size:13px}
  .B .topbar{background:#174c3d;color:#fff;border-color:#174c3d}.B .brand svg{color:#b5e0cb}.B .topbar .muted{color:#cee1d8}.B .topbar button{background:transparent;color:#fff;border-color:#648779}
  .B main{display:flex;flex-direction:column;height:calc(100dvh - 206px);min-height:300px}.B .workspace{flex:1;min-height:100px;overflow:hidden}.B .reading-pane,.B .library-rail{overflow:auto}
  .B .record-dock{flex:none;max-height:45vh;overflow:auto}.B .record-dock>.row{position:sticky;top:-18px;background:white;z-index:1;padding:8px 0}
  .live-dock{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:10px 24px}.live-dock .actions{margin:0}.live-dock .actions button{min-height:36px;padding:7px 14px}.live-time{font-variant-numeric:tabular-nums}
  .C .topbar{background:#fff9ed}.C{background:#f2eee4}.C .guided-main{border-color:#d6d0bd}.C .guided-aside .muted{color:#676653}
  progress{width:100%;height:6px;accent-color:var(--accent)}*{scrollbar-color:#809b8e #e8eeeb;scrollbar-width:thin}
  .model-launch{max-width:230px;min-width:0;overflow-wrap:anywhere}.model-launch progress{display:block;margin-top:5px}.B .model-launch progress{accent-color:#b5e0cb}
  #model-panel{display:grid;gap:16px}.model-catalog{max-height:360px;overflow:auto;padding-right:6px}.model-row{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:9px}.model-row:first-child{padding-top:0}
  .model-row select{min-width:0;flex:1}.model-row button{flex:none}.model-row .row{align-items:start}.download-status{background:var(--soft);padding:14px;border:1px solid var(--line);border-radius:5px;display:grid;gap:10px}
  .download-percent{font-variant-numeric:tabular-nums}.model-source{color:var(--accent);text-underline-offset:3px}.model-filter{display:grid;gap:7px}.model-filter label{margin:0}
  .model-page{max-width:760px}.model-page h1{margin:16px 0 22px}
  @media(max-width:1000px){.topbar>.muted{display:none}}
  @media(max-width:1100px){.guided-shell{grid-template-columns:155px minmax(0,1fr);gap:20px}.guided-aside{grid-column:2}.guided-aside .meeting-list{display:grid;grid-template-columns:1fr 1fr;gap:16px}.topbar{gap:12px}.page{padding:24px}.capture-layout{gap:24px}.reading-pane{padding:24px}.workspace{grid-template-columns:235px minmax(0,1fr)}}
  @media(max-width:700px){.demo-banner{padding:8px 16px}.topbar{height:auto;min-height:64px;padding:14px 16px;flex-wrap:wrap}.topbar>.muted{display:none}.page{padding:20px 16px}.capture-layout,.library-layout,.workspace{grid-template-columns:1fr}.capture-main,.review{padding:20px}.library-rail{border-right:0;border-bottom:1px solid var(--line)}.library-rail .meeting-list{max-height:220px;overflow:auto}.reading-pane{padding:24px 20px}.record-dock{padding:16px}.record-dock .row{flex-wrap:wrap}.record-dock>.row>.grow{flex-basis:100%}.record-dock .setup{grid-template-columns:1fr}.record-dock .setup>*{grid-column:1}.guided-shell{padding:20px 16px;grid-template-columns:1fr}.steps{display:flex;flex-wrap:wrap;margin:0}.step{padding:8px;font-size:12px;gap:6px}.guided-aside{grid-column:1}.guided-aside .meeting-list{grid-template-columns:1fr}.state-details{margin:16px}.clock{font-size:48px}.field-grid{grid-template-columns:1fr}.switcher{bottom:12px;max-width:95vw;gap:8px}.switcher .label{min-width:160px}.app{padding-bottom:110px}}
  @media(max-height:650px){.capture-face{padding:12px 0}.capture-face .clock{font-size:44px}.capture-face .actions{margin-top:14px}.intro{margin-bottom:18px}}
  @media(prefers-reduced-motion:no-preference){.Recording .levels i{animation:level 900ms ease-out infinite alternate;animation-delay:calc(var(--i)*-70ms)}@keyframes level{to{height:calc(var(--bar)*.45)}}}
</style>
</head>
<body>
<div class="demo-banner">
  <span><strong>Throwaway UX prototype.</strong> Synthetic meetings. No audio captured. Nothing sent or saved.</span>
  <label class="row gap8">Demo scenario <select id="scenario"><option value="ready">Sample meetings</option><option value="no-model">No model installed</option><option value="empty">Empty library</option><option value="error">Capture device error</option><option value="download-error">Model download error</option></select></label>
</div>
<div id="app"></div>
<div id="notice" role="status" aria-live="polite"></div>
<div id="switcher"></div>
<script>
  const variants = ['A','B','C'];
  const names = {A:'Recording first',B:'Meeting workspace',C:'Guided capture'};
  // Whisper.net 1.9.1: GgmlType and QuantizationType at commit c6821abbde5ae021e398ebe875c94dea9d66c9e1.
  // Its v4 model mirror supplies every one of these 12 x 6 combinations. Custom GGML files use import.
  const encodings = ['NoQuantization','Q4_0','Q4_1','Q5_0','Q5_1','Q8_0'];
  const modelCatalog = [
    {id:'tiny',name:'Tiny',englishOnly:false},{id:'tiny.en',name:'Tiny.en',englishOnly:true},
    {id:'base',name:'Base',englishOnly:false},{id:'base.en',name:'Base.en',englishOnly:true},
    {id:'small',name:'Small',englishOnly:false},{id:'small.en',name:'Small.en',englishOnly:true},
    {id:'medium',name:'Medium',englishOnly:false},{id:'medium.en',name:'Medium.en',englishOnly:true},
    {id:'large-v1',name:'Large v1',englishOnly:false},{id:'large-v2',name:'Large v2',englishOnly:false},
    {id:'large-v3',name:'Large v3',englishOnly:false},{id:'large-v3-turbo',name:'Large v3 Turbo',englishOnly:false}
  ];
  const encodingLabel = encoding => encoding==='NoQuantization'?'Original (unquantized)':encoding;
  function modelArtifact(key){
    const [id,encoding]=key.split(':'),model=modelCatalog.find(m=>m.id===id);
    if(!model||!encodings.includes(encoding))throw new Error('Unknown demo model artifact: '+key);
    return {...model,key,encoding,label:`${model.name} / ${encodingLabel(encoding)}`};
  }
  const icons = {
    audio:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4" stroke-linecap="round"/></svg>',
    left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>',
    right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>'
  };
  const sampleTranscript = [
    ['00:00','Let us start with the launch review. We have two items to work through today: the revised schedule and the handover between the design and engineering teams.'],
    ['00:24','The prototype is ready for review. Before we commit to the layout, we should make sure recording controls remain visible and that people can find their transcripts without navigating through setup.'],
    ['01:08','Agreed. Let us compare the options with a few representative meetings, then collect feedback on the capture flow and the reading experience.'],
    ['02:16','For the next review, bring the revised screens and a list of open questions. We will decide on the direction together.']
  ];
  const samples = [
    {id:1,title:'Launch review',date:'Today, 09:00',duration:'24:18',language:'English',status:'Completed',transcript:sampleTranscript},
    {id:2,title:'Design handover',date:'Yesterday, 14:30',duration:'38:42',language:'English',status:'Completed',transcript:[['00:00','This synthetic meeting covers the design handover. The next step is to compare the proposed layouts with the team.'],['00:45','Please keep the current recording and local transcription capabilities available.']]},
    {id:3,title:'Revisao do projeto',date:'Yesterday, 10:15',duration:'16:05',language:'Brazilian Portuguese',status:'Queued',transcript:[]}
  ];
  const state = {
    variant:variants.includes(new URLSearchParams(location.search).get('variant')) ? new URLSearchParams(location.search).get('variant') : 'A',
    page:'record',step:0,status:'Idle',seconds:0,source:'both',microphone:'Default microphone',playback:'Default playback device',
    language:'English',title:'',destination:'C:\\Demo\\Sound Recorder',permission:false,
    downloadedModels:['tiny:NoQuantization','base:NoQuantization'],selectedModel:'base:NoQuantization',
    catalogEncodings:{},modelFilter:'all',download:null,
    selected:1,query:'',scenario:'ready',message:'',recordings:samples.map(r=>({...r})),jobs:[{id:3,title:'Revisao do projeto',status:'Queued'}],
    openDetails:new Set(),nextId:4
  };
  const esc = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const active = () => state.status !== 'Idle';
  const selectedModel = () => state.selectedModel&&state.downloadedModels.includes(state.selectedModel)?modelArtifact(state.selectedModel):null;
  const canTranscribe = language => !!selectedModel()&&(!selectedModel().englishOnly||language==='English');
  const downloading = () => state.download&&['Downloading','Verifying'].includes(state.download.status);
  const duration = () => [Math.floor(state.seconds/3600),Math.floor(state.seconds/60)%60,state.seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
  const badge = status => `<span class="badge ${status==='Completed'?'ready':status==='Queued'||status==='Running'?'pending':''}">${esc(status)}</span>`;
  const button = (action,text,css='',extra='') => `<button type="button" data-action="${action}" class="${css}" ${extra}>${text}</button>`;
  function detail(id,label,content,open=false){return `<details data-detail="${id}" ${state.openDetails.has(id)||open?'open':''}><summary>${label}</summary><div class="inside">${content}</div></details>`}
  function header(){
    const model=selectedModel(),download=state.download;
    const label=downloading()?`${modelArtifact(download.key).name} / <span data-download-percent>${download.percent}%</span>`:model?`${model.name} / change model`:'Choose a local model';
    return `<header class="topbar"><div class="brand">${icons.audio} Sound Recorder</div>${state.variant==='A'?`<nav class="tabs" aria-label="Main">${button('record-page','Record','quiet',state.page==='record'?'aria-current="page"':'')}${button('library-page','Library','quiet',state.page==='library'?'aria-current="page"':'')}</nav>`:''}<span class="grow"></span><span class="muted">Audio and transcription stay local</span>${button('model-settings',`<span>${downloading()?'Downloading: ':''}${label}</span>${downloading()?`<progress data-download-progress max="100" value="${download.percent}" aria-label="Model download progress"></progress>`:''}`,'model-launch',`aria-label="Show local model setup"`)}</header>`;
  }
  function sourceControls(){
    return `<div><label>What do you want to capture?</label><div class="source-buttons" role="group" aria-label="Audio source">${[['mic','Microphone'],['system','System audio'],['both','Both']].map(([v,n])=>button('source',n,'',`data-value="${v}" aria-pressed="${state.source===v}" ${active()?'disabled':''}`)).join('')}</div></div>`;
  }
  function devices(){
    return `<div class="field-grid"><div><label for="microphone">Microphone</label><select id="microphone" data-field="microphone" ${state.source==='system'||active()?'disabled':''}>${['Default microphone','Demo USB microphone'].map(d=>`<option ${state.microphone===d?'selected':''}>${d}</option>`).join('')}</select></div><div><label for="playback">Playback device</label><select id="playback" data-field="playback" ${state.source==='mic'||active()?'disabled':''}>${['Default playback device','Demo USB headphones'].map(d=>`<option ${state.playback===d?'selected':''}>${d}</option>`).join('')}</select></div></div>`;
  }
  function captureWarning(){
    return state.source==='mic'?'<p class="muted">Microphone input is saved as mono.</p>':`<p class="warning">All sound from the selected playback device may be captured, including calls, notifications, and other applications. Sound from only one call or application cannot be guaranteed. ${state.source==='both'?'Use headphones for combined capture. Echo cancellation is not guaranteed.':''}</p>`;
  }
  function metadata(){
    return `<div><label for="title">Recording title <span class="muted">(optional)</span></label><input id="title" data-field="title" placeholder="e.g. Weekly team meeting" value="${esc(state.title)}" ${active()?'disabled':''}></div><div><label for="language">Spoken language</label><select id="language" data-field="language" ${active()?'disabled':''}>${['English','Brazilian Portuguese'].map(l=>`<option ${state.language===l?'selected':''}>${l}</option>`).join('')}</select></div>`;
  }
  function modelSettings(){
    const model=selectedModel();
    const filtered=modelCatalog.filter(m=>state.modelFilter==='all'||(state.modelFilter==='english'?m.englishOnly:!m.englishOnly));
    const catalog=`<p class="muted">All 12 Whisper.net 1.9.1 model families, with 6 downloadable encodings each (72 files). English-only models cannot transcribe Brazilian Portuguese.</p><div class="model-filter"><label for="model-filter">Catalog language support</label><select id="model-filter" data-field="modelFilter"><option value="all" ${state.modelFilter==='all'?'selected':''}>All models</option><option value="multilingual" ${state.modelFilter==='multilingual'?'selected':''}>Multilingual</option><option value="english" ${state.modelFilter==='english'?'selected':''}>English only</option></select></div><div class="model-catalog" role="region" aria-label="Available model downloads" tabindex="0">${filtered.map(m=>{
      const encoding=state.catalogEncodings[m.id]||'NoQuantization',key=`${m.id}:${encoding}`,exists=state.downloadedModels.includes(key);

  function renderState(){
    const output=document.getElementById('state-output');

  function PrototypeSwitcher(){
    return `<nav class="switcher" aria-label="Prototype variants">${button('previous',icons.left,'','aria-label="Previous variant"')}<span class="label"><strong>${state.variant} / ${names[state.variant]}</strong><small>Compare layouts / left and right keys</small></span>${button('next-variant',icons.right,'','aria-label="Next variant"')}</nav>`;

  function render(){
    const app=document.getElementById('app');
    app.className=`app ${state.variant}`;
    const liveDock=active()&&state.variant!=='B'?`<section class="live-dock row spread wrap" aria-label="Persistent capture controls">${status()}<span class="live-time">${duration()}</span>${actions()}</section>`:'';
    app.innerHTML=header()+liveDock+({A:VariantA,B:VariantB,C:VariantC}[state.variant])()+detail('state','Prototype state / in memory only','<pre id="state-output"></pre>');

    document.getElementById('switcher').innerHTML=PrototypeSwitcher();
    renderState();

  let noticeTimer;
  function notify(message){
    state.message=message;
    clearTimeout(noticeTimer);
    const notice=document.getElementById('notice');
    notice.className='toast';notice.textContent=message;
    renderState();
    noticeTimer=setTimeout(()=>{notice.className='';notice.textContent=''},6000);
  }
  function changeVariant(offset){
    state.variant=variants[(variants.indexOf(state.variant)+offset+variants.length)%variants.length];
    const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);

    document.querySelector(`[data-action="${offset<0?'previous':'next-variant'}"]`).focus();
  }
  function showModel(){
    state.openDetails.add('model');
    if(state.variant==='B')state.page='models';
    else {state.openDetails.add('advanced');state.openDetails.add('dock')}
    if(state.variant==='A')state.page='record';
    if(state.variant==='C'&&!active())state.step=0;
    render();
    const panel=document.getElementById('model-panel');
    if(panel){panel.scrollIntoView({block:'center',behavior:'instant'});(panel.querySelector('select:not(:disabled)')||panel.querySelector('summary')).focus()}
    else notify('Stop the demo recording before changing the local model.');
  }
  function retry(id){
    const recording=state.recordings.find(r=>r.id===id);
    if(!recording)return;
    if(!canTranscribe(recording.language)){showModel();notify('Choose a downloaded model that supports '+recording.language+' before retrying.');return}
    if(state.jobs.some(j=>j.status==='Running')){notify('One local transcription runs at a time. Finish or cancel the running demo job first.');return}
    let job=state.jobs.find(j=>j.id===id);
    if(!job){job={id,title:recording.title,status:'Running'};state.jobs.push(job)}
    job.status='Running';job.model=state.selectedModel;recording.status='Running';render();
    setTimeout(()=>{
      if(!state.jobs.includes(job)||job.status!=='Running')return;
      job.status='Completed';recording.status='Completed';
      if(!recording.transcript.length)recording.transcript=recording.language==='Brazilian Portuguese'?[['00:00','Esta e uma transcricao sintetica para avaliar a interface. Nenhum audio foi capturado.']]:[['00:00','This is a synthetic transcript for reviewing the interface. No audio was captured.']];
      render();notify('Demo transcript ready. No speech recognition was performed.');
    },3000);

  let downloadTimer;
  function startDownload(key){
    const artifact=modelArtifact(key);
    if(downloading()){notify('Finish or cancel the current demo download first.');return}
    if(state.downloadedModels.includes(key)){notify('This model is already downloaded. Select it to use it.');return}
    state.download={key,percent:0,status:'Downloading'};render();
    clearInterval(downloadTimer);
    downloadTimer=setInterval(()=>{
      const d=state.download;
      if(d.status==='Verifying'){
        clearInterval(downloadTimer);d.status='Completed';state.downloadedModels.push(key);render();
        notify(artifact.label+' downloaded (demo). Choose it from Downloaded models; your selected model has not changed.');return;
      }
      d.percent=Math.min(100,d.percent+5);
      if(state.scenario==='download-error'&&d.percent>=35){
        clearInterval(downloadTimer);d.status='Failed';render();notify('Demo download failed. Existing models and selection are unchanged. Retry the download.');return;
      }
      if(d.percent===100){d.status='Verifying';render();return}
      document.querySelectorAll('[data-download-progress]').forEach(el=>el.value=d.percent);
      document.querySelectorAll('[data-download-percent]').forEach(el=>el.textContent=d.percent+'%');
      renderState();
    },350);
  }
  document.addEventListener('click',event=>{
    const summary=event.target.closest('summary');
    if(summary?.parentElement.dataset.detail){
      const details=summary.parentElement;
      details.open?state.openDetails.delete(details.dataset.detail):state.openDetails.add(details.dataset.detail);
      renderState();return;
    }
    const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
    const action=target.dataset.action,id=Number(target.dataset.id);
    if(action==='previous'||action==='next-variant'){changeVariant(action==='previous'?-1:1);return}
    if(action==='source')state.source=target.dataset.value;
    if(action==='record-page')state.page='record';
    if(action==='library-page')state.page='library';
    if(action==='select'){state.selected=id;state.page='library'}
    if(action==='step')state.step=Number(target.dataset.value);
    if(action==='next')state.step=Math.min(2,state.step+1);
    if(action==='back')state.step=Math.max(0,state.step-1);
    if(action==='restart'){state.step=0;state.title='';state.permission=false;state.seconds=0}
    if(action==='model-settings'){showModel();return}
    if(action==='start'){
      if(!state.permission){
        state.openDetails.add('dock');render();
        const checkbox=document.getElementById('permission');checkbox?.scrollIntoView({block:'center'});checkbox?.focus();
        notify('Confirm permission to record before starting the demo.');return;
      }
      if(state.scenario==='error'){notify('Demo device error: the selected microphone is unavailable. Choose the Sample meetings scenario to retry.');return}
      if(!state.destination.trim()){state.openDetails.add('advanced');state.openDetails.add('dock');render();document.getElementById('destination')?.focus();notify('Choose a local destination before starting.');return}
      state.status='Recording';state.seconds=0;notify('Simulated capture started. No microphone or playback device is accessed.');
    }
    if(action==='pause')state.status='Paused';
    if(action==='resume')state.status='Recording';
    if(action==='stop'){
      state.status='Idle';
      const compatible=canTranscribe(state.language);
      const r={id:state.nextId++,title:state.title.trim()||'Untitled meeting',date:'Just now / demo',duration:duration(),language:state.language,status:compatible?'Queued':'Saved',transcript:[]};
      state.recordings.unshift(r);state.selected=r.id;state.permission=false;

      if(state.variant!=='A')state.page='library';
      notify('Demo recording saved in memory only. '+(compatible?'Transcription queued; select Retry to simulate it.':'Choose a compatible downloaded model to transcribe later.'));
    }
    if(action==='cancel-job'){
      const job=state.jobs.find(j=>j.id===id),r=state.recordings.find(r=>r.id===id);

      if(!state.downloadedModels.includes('base:NoQuantization'))state.downloadedModels.push('base:NoQuantization');

    }

    if(action==='use-model'){state.selectedModel=target.dataset.key;notify(modelArtifact(state.selectedModel).label+' selected for new transcription jobs.')}
    if(action==='download-model'){startDownload(target.dataset.key);return}
    if(action==='cancel-download'){clearInterval(downloadTimer);state.download.status='Cancelled';notify('Demo download cancelled. No model was added; your selection is unchanged.')}
    if(action==='choose-folder'){document.getElementById('destination').focus();notify('Edit the demo destination field. No real folder picker or filesystem access.');return}
    if(action==='open-folder')notify(`Demo folder: ${state.destination}. Explorer is not opened.`);
    if(action==='output-txt'||action==='output-srt')notify(`Demo output: ${state.destination}\\meeting.${action==='output-txt'?'txt':'srt'}. No file is written.`);
    if(action==='view-transcript')notify('Inline transcript review is a proposed replacement for the production transcript viewer.');
    render();
    if(['step','next','back','restart'].includes(action)){
      const heading=document.querySelector('.guided-main h1');
      if(heading){heading.tabIndex=-1;heading.focus();heading.scrollIntoView({block:'start'})}
    }
  });
  document.addEventListener('input',event=>{
    if(event.target.dataset.encoding){
      const id=event.target.dataset.encoding,scroll=document.querySelector('.model-catalog').scrollTop;
      state.catalogEncodings[id]=event.target.value;render();

  document.addEventListener('keydown',event=>{
    if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('input,textarea,select,[contenteditable],summary'))return;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();changeVariant(event.key==='ArrowLeft'?-1:1)}
  });
  addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');state.variant=variants.includes(v)?v:'A';render()});
  setInterval(()=>{if(state.status==='Recording'){state.seconds++;const clockNode=document.getElementById('clock');if(clockNode)clockNode.textContent=duration();document.querySelectorAll('.live-time').forEach(node=>node.textContent=duration());renderState()}},1000);
  render();
</script>
</body>
</html>
